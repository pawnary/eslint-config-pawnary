on:
  workflow_call:
jobs:
  reusable_dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: install dependencies
        if: steps.setup.outputs.node-modules-cache != 'true'
        run: pnpm install --frozen-lockfile
