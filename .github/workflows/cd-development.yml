name: 'Continuous Delivery Development'
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/README.md'
jobs:
  dependencies:
    name: 'CD dependencies'
    uses: ./.github/workflows/reusable-dependencies.yml
  deploy:
    name: 'Bump version and deploy to private GitHub registry'
    needs:
      - dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AINU_APP_ID }}
          private-key: ${{ secrets.AINU_APP_PRIVATE_KEY }}
          owner: pawnary
          repositories: eslint-config-pawnary
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: master
          persist-credentials: true
      - uses: ./.github/actions/setup
      - name: Configure GitHub private registry
        shell: bash
        run: |
          pnpm config set @pawnary:registry=https://npm.pkg.github.com
          pnpm config set -- "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
      - name: Build
        run: pnpm build
      - name: Bump prerelease version
        id: bump
        run: |
          set -euo pipefail
          pnpm -r version prerelease --preid "$(git rev-parse --short "$GITHUB_SHA")" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Commit and push changes
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_APP_TOKEN}@github.com/${{ github.repository }}.git
          git add package.json **/package.json
          git commit -m "chore([skip ci]): bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:master
      - name: Deploy to GitHub private npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm -r publish --access=restricted --tag next --no-git-checks
