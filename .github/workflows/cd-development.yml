name: 'Continuous Delivery Development'
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
jobs:
  dependencies:
    name: 'Install dependencies'
    runs-on: ubuntu-latest
    steps:
      - &create-app-token
        name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AINU_APP_ID }}
          private-key: ${{ secrets.AINU_APP_PRIVATE_KEY }}
          owner: pawnary
      - &checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: master
          persist-credentials: true
      - &setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pawnary'
      - &cache-node-modules
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: |
            ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    name: 'Bump version and deploy to GitHub private npm registry'
    needs:
      - dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - *create-app-token
      - *checkout
      - *setup-node
      - *cache-node-modules
      - name: Bump prerelease version
        id: bump
        run: |
          set -euo pipefail
          npx lerna version --yes --no-push --no-git-tag-version --force-publish --exact --preid "$(git rev-parse --short "$GITHUB_SHA")" prerelease
          VERSION=$(node -p "require('./lerna.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Commit and push changes
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "ainu[bot]"
          git config user.email "1990661+ainu[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_APP_TOKEN}@github.com/${{ github.repository }}.git
          npx prettier --write .
          git add .
          git commit -m "chore([skip ci]): bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:master
      - name: Deploy to GitHub private npm registry
        run: |
          npx lerna publish from-package --dist-tag next --yes
