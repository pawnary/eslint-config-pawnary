name: 'Continuous Delivery Development'
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
jobs:
  dependencies:
    name: 'Install dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pawnary'
      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: |
            ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    name: 'Deploy to GitHub private npm registry'
    needs:
      - dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pawnary'
      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: |
            ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Build the client
        run: npm run build
      - name: Bump prerelease version
        id: bump
        run: |
          VERSION=$(npm version ${{ github.sha }} --preid=next --no-git-tag-version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Commit and push updated package.json
        run: |
          git config user.name "ainu"
          git config user.email "ainu@pawnary.cl"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git remote set-url origin https://x-access-token:${{ secrets.AINU_BOT_TOKEN }}@github.com/pawnary/pawnary-prisma-client.git
          git push origin HEAD:master
      - name: Deploy to GitHub private npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --tag next --access=restricted
