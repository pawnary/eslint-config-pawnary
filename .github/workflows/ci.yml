name: 'continuous integration'
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
  packages: read
jobs:
  dependencies:
    name: 'ci dependencies'
    uses: ./.github/workflows/reusable-dependencies.yml
  prettier:
    name: 'ci prettier'
    needs:
      - dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
      - uses: ./.github/actions/setup
      - name: run prettier
        run: pnpm run prettier:check
